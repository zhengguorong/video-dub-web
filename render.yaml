services:
  - type: web
    name: video-dubbing-tool
    env: docker
    region: oregon
    plan: starter
    branch: main
    envVars:
      - key: VOLCENGINE_AGENT_PLAN_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-3.5-turbo
