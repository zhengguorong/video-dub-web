<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频配音工具 - 英文视频转中文配音</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f1ff;
        }
        
        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8e9ff;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .upload-text {
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .upload-hint {
            color: #999;
            font-size: 14px;
        }
        
        .status-box {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            display: none;
        }
        
        .status-box.show {
            display: block;
        }
        
        .status-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        
        .status-message {
            color: #666;
            margin-bottom: 15px;
        }
        
        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
        }
        
        .transcript-editor {
            margin-top: 20px;
            display: none;
        }
        
        .transcript-editor.show {
            display: block;
        }
        
        .segment {
            padding: 10px;
            background: white;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #ddd;
        }
        
        .segment-time {
            color: #667eea;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .segment-text {
            width: 100%;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 8px;
            font-size: 14px;
            resize: vertical;
        }
        
        .chinese-editor {
            margin-top: 20px;
            display: none;
        }
        
        .chinese-editor.show {
            display: block;
        }
        
        .chinese-editor textarea {
            width: 100%;
            min-height: 200px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            font-size: 16px;
            line-height: 1.8;
            resize: vertical;
        }
        
        .speaker-select {
            margin-top: 15px;
        }
        
        .speaker-select label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .speaker-select select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 140px;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: #f8f9ff;
        }
        
        .btn-success {
            background: #10b981;
            color: white;
        }
        
        .btn-success:hover:not(:disabled) {
            background: #059669;
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .info-box {
            background: #e0f2fe;
            border-left: 4px solid #0284c7;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 14px;
            color: #0c4a6e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 视频配音工具</h1>
        <p class="subtitle">上传英文视频，自动生成中文绘本风格配音</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">点击上传或拖拽视频文件</div>
            <div class="upload-hint">支持 MP4, AVI, MOV, MKV, WebM（最大 100MB）</div>
            <input type="file" id="fileInput" accept="video/*">
        </div>
        
        <div class="status-box" id="statusBox">
            <div class="status-title">处理状态</div>
            <div class="status-message" id="statusMessage">正在上传...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            
            <div class="transcript-editor" id="transcriptEditor">
                <h3 style="margin-bottom: 15px;">📝 英文字幕</h3>
                <div id="transcriptSegments"></div>
                <div class="button-group">
                    <button class="btn-primary" id="btnTranslate">🤖 AI 翻译成中文</button>
                    <button class="btn-secondary" id="btnSkipTranslate">✍️ 手动编写中文</button>
                </div>
            </div>
            
            <div class="chinese-editor" id="chineseEditor">
                <h3 style="margin-bottom: 15px;">🇨🇳 中文配音稿</h3>
                <textarea id="chineseScript" placeholder="请输入或编辑中文配音稿..."></textarea>
                
                <div class="speaker-select">
                    <label>选择配音声音：</label>
                    <select id="speakerSelect">
                        <option value="zh_female_xiaohe_uranus_bigtts">小和（女声，温柔）</option>
                        <option value="zh_female_wanwanyaya_uranus_bigtts">弯弯（女声，活泼）</option>
                        <option value="zh_male_qingxin_uranus_bigtts">清新（男声，清晰）</option>
                        <option value="zh_female_shuangkuai_uranus_bigtts">爽快（女声，明快）</option>
                    </select>
                </div>
                
                <div class="button-group">
                    <button class="btn-primary" id="btnSaveChinese">💾 保存中文稿</button>
                    <button class="btn-success" id="btnSynthesize">🎤 开始合成配音</button>
                </div>
            </div>
            
            <div class="button-group" id="downloadArea" style="display: none;">
                <button class="btn-success" id="btnDownload">⬇️ 下载配音视频</button>
                <button class="btn-secondary" id="btnReset">🔄 处理新视频</button>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            
            <div class="info-box" id="infoBox" style="display: none;">
                ℹ️ 提示：如果未配置 LLM 环境变量，请直接手动编写中文配音稿
            </div>
        </div>
    </div>
    
    <script>
        let currentJobId = null;
        let pollInterval = null;
        
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const statusBox = document.getElementById('statusBox');
        const statusMessage = document.getElementById('statusMessage');
        const progressFill = document.getElementById('progressFill');
        const transcriptEditor = document.getElementById('transcriptEditor');
        const transcriptSegments = document.getElementById('transcriptSegments');
        const chineseEditor = document.getElementById('chineseEditor');
        const chineseScript = document.getElementById('chineseScript');
        const downloadArea = document.getElementById('downloadArea');
        const errorMessage = document.getElementById('errorMessage');
        const infoBox = document.getElementById('infoBox');
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileUpload(files[0]);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileUpload(e.target.files[0]);
            }
        });
        
        async function handleFileUpload(file) {
            const formData = new FormData();
            formData.append('file', file);
            
            statusBox.classList.add('show');
            statusMessage.textContent = '正在上传视频...';
            progressFill.style.width = '10%';
            hideError();
            
            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || '上传失败');
                }
                
                const data = await response.json();
                currentJobId = data.job_id;
                
                startPolling();
            } catch (error) {
                showError(error.message);
            }
        }
        
        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            
            pollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/jobs/${currentJobId}`);
                    const job = await response.json();
                    
                    updateStatus(job);
                } catch (error) {
                    console.error('Polling error:', error);
                }
            }, 2000);
        }
        
        function updateStatus(job) {
            statusMessage.textContent = job.message;
            
            const progressMap = {
                'uploaded': 15,
                'extracting_audio': 25,
                'transcribing': 40,
                'waiting_edit': 50,
                'translating': 60,
                'waiting_tts': 70,
                'synthesizing': 80,
                'separating': 85,
                'mixing': 90,
                'muxing': 95,
                'completed': 100,
                'failed': 100
            };
            
            progressFill.style.width = (progressMap[job.state] || 0) + '%';
            
            if (job.state === 'waiting_edit' && job.transcript) {
                transcriptEditor.classList.add('show');
                renderTranscript(job.transcript);
            }
            
            if (job.state === 'waiting_tts' && job.chinese_script) {
                chineseEditor.classList.add('show');
                chineseScript.value = job.chinese_script;
            }
            
            if (job.state === 'completed') {
                clearInterval(pollInterval);
                downloadArea.style.display = 'flex';
                statusMessage.textContent = '✅ 处理完成！可以下载了';
            }
            
            if (job.state === 'failed') {
                clearInterval(pollInterval);
                showError(job.error || '处理失败');
            }
        }
        
        function renderTranscript(segments) {
            transcriptSegments.innerHTML = segments.map((seg, i) => `
                <div class="segment">
                    <div class="segment-time">${formatTime(seg.start)} - ${formatTime(seg.end)}</div>
                    <textarea class="segment-text" data-index="${i}">${seg.text}</textarea>
                </div>
            `).join('');
        }
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        document.getElementById('btnTranslate').addEventListener('click', async () => {
            try {
                const response = await fetch(`/api/jobs/${currentJobId}/translate`, {
                    method: 'POST'
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    
                    if (error.detail && error.detail.includes('LLM')) {
                        infoBox.style.display = 'block';
                        chineseEditor.classList.add('show');
                        return;
                    }
                    
                    throw new Error(error.detail || '翻译失败');
                }
                
                statusMessage.textContent = '正在翻译成中文...';
            } catch (error) {
                showError(error.message);
            }
        });
        
        document.getElementById('btnSkipTranslate').addEventListener('click', () => {
            chineseEditor.classList.add('show');
        });
        
        document.getElementById('btnSaveChinese').addEventListener('click', async () => {
            const script = chineseScript.value.trim();
            
            if (!script) {
                showError('请输入中文配音稿');
                return;
            }
            
            try {
                const response = await fetch(`/api/jobs/${currentJobId}/chinese-script`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ script })
                });
                
                if (!response.ok) throw new Error('保存失败');
                
                statusMessage.textContent = '✅ 中文稿已保存';
            } catch (error) {
                showError(error.message);
            }
        });
        
        document.getElementById('btnSynthesize').addEventListener('click', async () => {
            const script = chineseScript.value.trim();
            const speaker = document.getElementById('speakerSelect').value;
            
            if (!script) {
                showError('请输入中文配音稿');
                return;
            }
            
            try {
                const formData = new FormData();
                formData.append('speaker', speaker);
                
                const response = await fetch(`/api/jobs/${currentJobId}/synthesize`, {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || '合成失败');
                }
                
                statusMessage.textContent = '正在合成配音...';
                startPolling();
            } catch (error) {
                showError(error.message);
            }
        });
        
        document.getElementById('btnDownload').addEventListener('click', () => {
            window.location.href = `/api/jobs/${currentJobId}/download`;
        });
        
        document.getElementById('btnReset').addEventListener('click', () => {
            location.reload();
        });
        
        function showError(message) {
            errorMessage.textContent = '❌ ' + message;
            errorMessage.classList.add('show');
        }
        
        function hideError() {
            errorMessage.classList.remove('show');
        }
    </script>
</body>
</html>
